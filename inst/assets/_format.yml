format: 
  html:
    grid:
      sidebar-width: 500px
      body-width: 800px
    theme: 
      - cosmo
      - assets/book.scss
    mainfont: "Atkinson Hyperlegible, sans-serif"
    highlight-style: atom-one
    code-link: true
    editor: visual
    bibliography:
      - assets/bibliography.bib
      - assets/book.bib
      - assets/packages.bib
    from: markdown+emoji
    link-citations: true
