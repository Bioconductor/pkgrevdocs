format: 
  html:
    grid:
      sidebar-width: 500px
      body-width: 800px
    theme:
      light:
        - cosmo
        - assets/book.scss
      dark:
        - darkly
        - assets/book.scss
        - assets/book-dark.scss
    include-in-header: pages/includes/header.html
    mainfont: "Atkinson Hyperlegible, sans-serif"
    highlight-style: atom-one
    code-link: true
    editor: visual
    bibliography:
      - assets/bibliography.bib
      - assets/book.bib
      - assets/packages.bib
    from: markdown+emoji
    link-citations: true
