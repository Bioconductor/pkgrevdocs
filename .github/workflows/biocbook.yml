name: biocbook

on:
  push:
    branches:
      - devel
      - RELEASE_**
  ## Manual runs build the book from any other branch against Bioconductor
  ## devel, without pushing the Docker image or deploying the book
  workflow_dispatch:

env:
  ## quarto release the book is rendered with. quarto >= 1.11 renders 
  ## `llms.txt` and a Markdown copy of every page, for AI assistants. Leave it
  ## empty to use the quarto shipped with the Bioconductor image.
  QUARTO_VERSION: "1.11.5"

jobs:
  build-push:
    runs-on: ubuntu-latest
    name: build-book (${{ github.ref_name }})
    permissions:
      contents: write
      packages: write

    steps:
      
      - name: 🧾 Checkout repository
        uses: actions/checkout@v7

      - name: 🐳 Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
  
      - name: 📝 Get book info
        id: info
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          Pkgname=$(grep -m1 -E '^Package: +' DESCRIPTION | sed -E 's/.*: +//')
          echo Pkgname=${Pkgname} >> "${GITHUB_ENV}"
          pkgname=${Pkgname,,}
          echo pkgname=${pkgname} >> "${GITHUB_ENV}"
          owner=${OWNER,,}
          echo owner=${owner} >> "${GITHUB_ENV}"
          echo pkgversion=$(grep -m1 -E '^Version: +' DESCRIPTION | sed -E 's/.*: +//') >> "${GITHUB_ENV}"
          case "${GITHUB_REF_NAME}" in
            devel|RELEASE_*) echo bioc_version=${GITHUB_REF_NAME} >> "${GITHUB_ENV}" ; echo deploy=true >> "${GITHUB_ENV}" ;;
            *) echo bioc_version=devel >> "${GITHUB_ENV}" ; echo deploy=false >> "${GITHUB_ENV}" ;;
          esac

      - name: 🔐 Log in to the Github Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ env.owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷 Get metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.owner }}/${{ env.pkgname }}
          tags: |
            type=ref,event=branch
            ${{ env.pkgversion }}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'devel') }}

      - name: 📦 Install, build and check package in local Docker image
        id: docker
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            BIOC_VERSION=${{ env.bioc_version }}
            QUARTO_VERSION=${{ env.QUARTO_VERSION }}
          secrets: |
            "GITHUB_PAT=${{ secrets.GITHUB_TOKEN }}"

      - name: 🚀 Push local Docker image to ghcr.io
        if: env.deploy == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            BIOC_VERSION=${{ env.bioc_version }}
            QUARTO_VERSION=${{ env.QUARTO_VERSION }}
          secrets: |
            "GITHUB_PAT=${{ secrets.GITHUB_TOKEN }}"

      - name: 📚 Recover pkg artifacts generated during build in local Docker container (pkg bundle and book) 
        env:
          IMG: ${{ steps.docker.outputs.ImageID }}
        run: |
          SHA=$(docker container create ${{ env.IMG }})
          docker container cp ${SHA}:/${{ env.Pkgname }}_${{ env.pkgversion }}.tar.gz .
          tar --extract --gzip --file ${{ env.Pkgname }}_${{ env.pkgversion }}.tar.gz
          echo bundle_path=${{ env.Pkgname }}_${{ env.pkgversion }}.tar.gz >> "${GITHUB_ENV}"
          echo book_path=${{ env.Pkgname }}/inst/doc/book/ >> "${GITHUB_ENV}"

      - name: 🏷 Get gh-branch directory to deploy to
        run: |
          echo target_folder=$(echo ${{ github.ref_name }} | sed 's,RELEASE_,,' | tr '_' '.') >> "${GITHUB_ENV}"

      - name: 🚀 Deploy book to Github Pages on versioned branch
        if: env.deploy == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ${{ env.book_path }}/ 
          target-folder: docs/${{ env.target_folder }}/ 
          branch: gh-pages
          clean: false 

      - name: 🤖 Index the llms.txt of every deployed version
        if: env.deploy == 'true'
        run: |
          git fetch --depth 1 origin gh-pages
          versions=$(git ls-tree --name-only origin/gh-pages docs/ | sed 's,^docs/,,' | sort -rV)
          mkdir -p llms-index
          ## Serve every file as it is: otherwise, GitHub Pages runs Jekyll,
          ## which turns the Markdown copy of each page (<page>.md) into an
          ## HTML page that collides with the book's own <page>.html
          touch llms-index/.nojekyll
          {
            echo "# ${{ env.Pkgname }}"
            echo
            echo "> Every version of this book, one per Bioconductor release, each with its own llms.txt."
            echo
            echo "## Versions"
            echo
            for v in $(echo "${versions}" | grep -x devel) $(echo "${versions}" | grep -vx devel); do
              if git cat-file -e "origin/gh-pages:docs/${v}/llms.txt" 2>/dev/null; then
                echo "- [${v}](${v}/llms.txt)"
              fi
            done
          } > llms-index/llms.txt
          cat llms-index/llms.txt

      - name: 🚀 Deploy the index of versions to Github Pages
        if: env.deploy == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: llms-index/
          target-folder: docs/
          branch: gh-pages
          clean: false 

      - name: 💾 Upload package bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: bundle
          path: ${{ env.bundle_path }}

      - name: 💾 Upload book artifact
        uses: actions/upload-artifact@v7
        with:
          name: book
          path: ${{ env.book_path }}
